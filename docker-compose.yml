services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urv
      POSTGRES_PASSWORD: urv
      POSTGRES_DB: urv
    ports:
      - "${URV_DB_PORTA:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urv -d urv"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://urv:urv@db:5432/urv
      TEST_DATABASE_URL: postgresql+psycopg://urv:urv@db:5432/urv_test
      JWT_SECRET: ${JWT_SECRET:-segredo-local-de-demonstracao}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGENS: '["http://localhost:5173"]'
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head
      && python -m scripts.seed
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
